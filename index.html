<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142925"><meta name="description" content="A little moment of good, whenever you need it."><title>Good Vibes</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;--ink:#f8f0dc;--gold:#f3cf91}*{box-sizing:border-box}html{min-height:100%;background:#142925}body{margin:0;min-height:100svh;background:radial-gradient(ellipse 80% 55% at 50% 48%,#29483f 0%,transparent 85%),linear-gradient(145deg,#172e2b,#10231f);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;padding:calc(35px + env(safe-area-inset-top)) 26px calc(35px + env(safe-area-inset-bottom));text-align:center}.quote{font-size:clamp(1.65rem,5vw,2.65rem);line-height:1.4;letter-spacing:-.035em;font-weight:450;max-width:670px;text-wrap:balance;min-height:3em;display:flex;align-items:center;justify-content:center}.quote-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:700px}.author{font-size:.9rem;letter-spacing:.035em;color:#d2c6a9}.author[hidden]{display:none}.quote-wrap.appear{animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}button{border:0;border-radius:999px;background:var(--gold);color:#25352c;font:700 1rem ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:60px;padding:0 34px;cursor:pointer;box-shadow:0 12px 40px #0c171333;transition:background .2s,transform .2s}button:hover{background:#ffe0a8;transform:translateY(-2px)}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid white;outline-offset:4px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><div class="quote-wrap" aria-live="polite" aria-atomic="true"><div class="quote" id="quote">Tap for a fresh perspective.</div><div class="author" id="author" hidden></div></div><button id="next" type="button">Good vibes ✦</button></main><script>
const messages=[{"text":"An ordinary Tuesday can become a memory you keep for years.","author":null},{"text":"You can be ambitious without treating your present life as a waiting room.","author":null},{"text":"Not every meaningful change announces itself.","author":null},{"text":"The people you love will remember your attention more than your efficiency.","author":null},{"text":"A quiet mind can notice things a hurried mind walks past.","author":null},{"text":"You are allowed to be a beginner at something that matters to you.","author":null},{"text":"There is a kind of freedom in not needing to win every argument.","author":null},{"text":"Sometimes the most productive thing you can do is notice that you're alive.","author":null},{"text":"You don't have to turn every interest into an achievement.","author":null},{"text":"A conversation can change the direction of an entire week.","author":null},{"text":"Some questions are worth living with instead of rushing to answer.","author":null},{"text":"You can take your work seriously without taking every thought seriously.","author":null},{"text":"The ability to begin again is one of life's most underrated gifts.","author":null},{"text":"A life can be rich in ways that never show up on a résumé.","author":null},{"text":"The next interesting thing you learn might change how you see everything.","author":null},{"text":"A small act of generosity can outlast the moment it took.","author":null},{"text":"There is no requirement that joy be useful.","author":null},{"text":"You can leave room in your day for something unexpected.","author":null},{"text":"Noticing the light through a window is a perfectly good use of ten seconds.","author":null},{"text":"The best part of a day is sometimes the part you didn't plan.","author":null},{"text":"Your attention is one of the most generous things you can offer.","author":null},{"text":"It takes confidence to enjoy something without being good at it.","author":null},{"text":"You don't need to have an opinion about everything.","author":null},{"text":"A little more curiosity can make the familiar world feel new.","author":null},{"text":"Some of the strongest decisions are made quietly.","author":null},{"text":"There is wisdom in knowing when enough is enough.","author":null},{"text":"You can be grateful for where you are and curious about what's next.","author":null},{"text":"A good question can be more valuable than a quick answer.","author":null},{"text":"There are experiences worth having even if you never photograph them.","author":null},{"text":"You don't have to improve every moment. You can simply inhabit it.","author":null},{"text":"The way you speak to someone can become part of their day.","author":null},{"text":"You can be both a work in progress and someone worth celebrating.","author":null},{"text":"The world is full of people whose stories you haven't heard yet.","author":null},{"text":"Some days call for courage. Others call for a long walk.","author":null},{"text":"You may discover that what you once wanted is no longer what you need.","author":null},{"text":"A beautiful life doesn't have to look impressive from the outside.","author":null},{"text":"Making time for play is not a detour from living.","author":null},{"text":"You can change direction without calling the previous road a mistake.","author":null},{"text":"The first five minutes of trying often matter more than the hour spent hesitating.","author":null},{"text":"Sometimes peace arrives when you stop demanding certainty.","author":null},{"text":"The smallest rituals can become the strongest anchors.","author":null},{"text":"There's something remarkable about being able to learn a new way of seeing.","author":null},{"text":"An imperfect afternoon can still contain a perfect moment.","author":null},{"text":"You are free to let a good experience be enough on its own.","author":null},{"text":"One sincere compliment can travel a surprisingly long distance.","author":null},{"text":"You can practice being present without becoming perfect at it.","author":null},{"text":"The most memorable parts of life rarely come with a checklist.","author":null},{"text":"A little wonder is a reasonable response to being here at all.","author":null},{"text":"You don't have to explain why something makes you happy.","author":null},{"text":"Good company can make an unremarkable place unforgettable.","author":null},{"text":"There's dignity in doing a simple thing with care.","author":null},{"text":"Sometimes growth looks like needing less, not achieving more.","author":null},{"text":"You can hold high standards and still be gentle with yourself.","author":null},{"text":"The world becomes larger every time you learn something new.","author":null},{"text":"A well-spent hour doesn't always leave evidence behind.","author":null},{"text":"You can admire someone else's path without wanting to walk it.","author":null},{"text":"An unexpected laugh can interrupt a difficult day in the best way.","author":null},{"text":"There's no need to rush past the parts of life you once hoped for.","author":null},{"text":"Your future self might thank you for slowing down today.","author":null},{"text":"A moment of honest connection can matter more than a flawless performance.","author":null},{"text":"Not everything valuable can be measured.","author":null},{"text":"A change of scenery can sometimes become a change of perspective.","author":null},{"text":"There's room for seriousness and silliness in the same good life.","author":null},{"text":"You can make a day meaningful without making it extraordinary.","author":null},{"text":"The chance to notice beauty is available more often than we think.","author":null},{"text":"Being interested in the world is its own kind of optimism.","author":null},{"text":"A good life is built as much from attention as from action.","author":null},{"text":"You can appreciate how far you've come without declaring the journey finished.","author":null},{"text":"Some moments ask only that you show up and pay attention.","author":null},{"text":"The way you spend a quiet morning can shape the whole day.","author":null},{"text":"The things that matter most often ask for presence, not perfection.","author":null},{"text":"You can create a little more space between a feeling and a decision.","author":null},{"text":"There are still books that will surprise you and places that will move you.","author":null},{"text":"It is possible to be deeply committed and still make room for ease.","author":null},{"text":"Some of the best ideas begin as a playful question.","author":null},{"text":"I exist as I am, that is enough.","author":"Walt Whitman"},{"text":"Hope is the thing with feathers","author":"Emily Dickinson"},{"text":"Nothing great was ever achieved without enthusiasm.","author":"Ralph Waldo Emerson"},{"text":"To thine own self be true.","author":"William Shakespeare"},{"text":"The readiness is all.","author":"William Shakespeare"},{"text":"There is nothing either good or bad, but thinking makes it so.","author":"William Shakespeare"},{"text":"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt.","author":"William Shakespeare"},{"text":"The journey of a thousand miles begins with a single step.","author":"Lao Tzu (traditional attribution)"},{"text":"The unexamined life is not worth living.","author":"Socrates (as recorded by Plato)"},{"text":"Forever is composed of nows.","author":"Emily Dickinson"},{"text":"I am large, I contain multitudes.","author":"Walt Whitman"}];
const button=document.getElementById('next'),quote=document.getElementById('quote'),author=document.getElementById('author'),wrap=document.querySelector('.quote-wrap');
let remaining=[],last=-1;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function pick(){if(!remaining.length){remaining=messages.map((_,i)=>i).filter(i=>i!==last);shuffle(remaining)}const i=remaining.pop();last=i;return messages[i]}
button.addEventListener('click',()=>{const item=pick();quote.textContent=item.text;author.textContent=item.author?'— '+item.author:'';author.hidden=!item.author;wrap.classList.remove('appear');void wrap.offsetWidth;wrap.classList.add('appear')});
</script></body></html>
