<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d2a"><meta name="description" content="A little moment of good, whenever you need it."><title>Good Vibes — A little moment of good</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;--bg:#142925;--fg:#f8f0dc;--muted:#b9cbc1;--gold:#f3cf91}*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;min-height:100svh;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg);background:radial-gradient(ellipse 75% 55% at 50% 42%,#29483f 0%,transparent 78%),linear-gradient(150deg,#172e2b,#10231f);overflow-x:hidden}.shell{min-height:100svh;display:flex;flex-direction:column;max-width:900px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) clamp(24px,6vw,64px) calc(25px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.12rem;letter-spacing:-.045em;font-weight:750}.sun{font-size:1.6rem;color:var(--gold)}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 0 30px}.eyebrow{font-size:.69rem;font-weight:750;letter-spacing:.23em;color:var(--gold);margin:0 0 22px;text-transform:uppercase}.orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe8b5,#d8a86d 65%,#987a59);box-shadow:0 0 85px #e7bd7540,inset -9px -10px 25px #735c4540;margin:0 0 42px;animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}h1{font-size:clamp(2.6rem,8vw,5.3rem);line-height:1.08;letter-spacing:-.065em;font-weight:600;max-width:700px;margin:0}.sub{font-size:clamp(1rem,2.6vw,1.17rem);line-height:1.65;color:var(--muted);margin:22px 0 36px;max-width:430px}.primary{border:0;background:var(--gold);color:#25352c;border-radius:999px;min-height:62px;padding:0 35px;font-size:1.04rem;font-weight:750;cursor:pointer;box-shadow:0 12px 40px #0c171330;transition:transform .2s,background .2s}.primary:hover{background:#ffe0a8;transform:translateY(-2px)}.primary:active{transform:scale(.98)}.primary:focus-visible,.quiet:focus-visible{outline:3px solid #fff;outline-offset:4px}.message{margin-top:32px;max-width:570px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px}.quote{font-size:clamp(1.25rem,3.7vw,1.85rem);line-height:1.5;letter-spacing:-.025em;font-weight:450}.message[hidden]{display:none}.message.show .quote{animation:appear .45s both}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.quiet{border:1px solid #ffffff30;background:#ffffff08;border-radius:99px;color:var(--muted);padding:10px 17px;font-size:.85rem;cursor:pointer}.quiet:hover{background:#ffffff15;color:var(--fg)}footer{text-align:center;color:#a4bdb2;font-size:.83rem;letter-spacing:.01em}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-height:650px){.orb{width:65px;height:65px;margin-bottom:18px}main{padding:25px 0}.sub{margin:15px 0 24px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">✳ good vibes.</div><div class="sun" aria-hidden="true">☼</div></header><main><div class="orb" aria-hidden="true"></div><p class="eyebrow">A little moment of good</p><h1 id="heading">Good things are happening.</h1><p class="sub" id="intro">Sometimes you just need a little reminder.</p><button class="primary" id="next" type="button">✦ &nbsp; Give me some good vibes</button><section class="message" id="message" aria-live="polite" aria-atomic="true" hidden><div class="quote" id="quote"></div><button class="quiet" id="copy" type="button">Copy message</button></section></main><footer>A little positivity goes a long way. ✳</footer></div><script>
const messages=["Good things are still finding their way to you.","You are allowed to enjoy the moment you're in.","Some of the best days of your life haven't happened yet.","You bring something to the world that nobody else can.","A little progress is still progress.","There is beauty in beginning again.","You don't need a reason to smile today.","The world is better with your kindness in it.","Slow down. This moment counts too.","You have made it through every hard day so far.","Small joys make a big life.","You are growing, even when you cannot see it.","Your next chapter can surprise you.","There is no deadline for becoming yourself.","Let the good moments be enough.","You deserve the same patience you give others.","Today has room for something wonderful.","Not everything needs to be solved right now.","A peaceful moment is a meaningful one.","Your curiosity can take you somewhere beautiful.","The ordinary can be extraordinary.","You can start fresh at any moment.","Your presence matters more than perfection.","A little laughter can change the whole day.","The sun will rise again, and so will you.","You are more than your to-do list.","There is courage in showing up.","Life is happening in the small moments.","You can be proud of your effort.","Good energy grows when you share it.","One deep breath can be a fresh beginning.","The best things often begin quietly.","You don't have to earn your rest.","There are people who smile because of you.","Your pace is a perfectly valid pace.","There is joy in noticing what is already here.","Let yourself be pleasantly surprised.","You have permission to have a good day.","Your story is still unfolding.","Take the scenic route sometimes.","You are capable of creating lovely memories.","A new perspective can brighten everything.","You are not behind in your own life.","Even tiny victories deserve celebration.","Make room for a little wonder.","A kind word can travel farther than you think.","You can choose gentleness today.","Something simple might become your favorite memory.","There is always more to discover.","It's okay to feel hopeful.","You don't need to be perfect to be appreciated.","A good day can start in the middle of the day.","The world has not run out of beautiful things.","You are allowed to change your mind and grow.","Let the little wins add up.","Somewhere, something lovely is blooming.","You have reasons to look forward.","The good you do matters.","Find a reason to be curious today.","You can make today a little lighter."];
const button=document.getElementById('next'),panel=document.getElementById('message'),quote=document.getElementById('quote'),copy=document.getElementById('copy');
let remaining=[],last=-1;
function pick(){if(!remaining.length){remaining=messages.map((_,i)=>i).filter(i=>i!==last);shuffle(remaining)}const i=remaining.pop();last=i;return messages[i]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
button.addEventListener('click',()=>{quote.textContent=pick();panel.hidden=false;panel.classList.remove('show');void panel.offsetWidth;panel.classList.add('show');copy.textContent='Copy message';button.textContent='✦   Another good vibe'});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(quote.textContent);copy.textContent='Copied ✓'}catch{copy.textContent='Select and copy your message'}});
</script></body></html>
